<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your bag — Ember &amp; Bean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/pixel.js"></script>
</head>
<body data-base="../">
<header id="site-header"></header>

<main class="container">
  <h1 class="page-title">Your bag</h1>
  <div id="cart"></div>
</main>

<footer id="site-footer"></footer>

<script src="../assets/shop.js"></script>
<script>
  function render() {
    var lines = cartLines();
    var el = document.getElementById('cart');
    if (!lines.length) {
      el.innerHTML = '<div class="empty">Your bag is empty. <a href="../#shop">Browse our coffee</a></div>';
      return;
    }
    var subtotal = cartTotal();
    var shipping = subtotal >= 40 ? 0 : 6;
    el.innerHTML =
      '<div class="two-col">' +
      '  <div class="panel">' + lines.map(function (l) {
        return '<div class="line">' +
          '<div class="thumb">' + bagArt(l.product) + '</div>' +
          '<div><strong>' + l.product.name + '</strong><div class="muted">' + l.product.roast + ' roast · 12 oz</div>' +
          '<div class="qty"><button type="button" data-id="' + l.product.id + '" data-d="-1" aria-label="Decrease">−</button>' + l.qty +
          '<button type="button" data-id="' + l.product.id + '" data-d="1" aria-label="Increase">+</button></div></div>' +
          '<div>' + money(l.product.price * l.qty) + '</div></div>';
      }).join('') + '</div>' +
      '  <div class="panel">' +
      '    <h2>Summary</h2>' +
      '    <div class="sum-row"><span>Subtotal</span><span>' + money(subtotal) + '</span></div>' +
      '    <div class="sum-row"><span>Shipping</span><span>' + (shipping ? money(shipping) : 'Free') + '</span></div>' +
      '    <div class="sum-row total"><span>Total</span><span>' + money(subtotal + shipping) + '</span></div>' +
      '    <p><a class="btn block" id="checkout-button" href="../checkout/">Checkout</a></p>' +
      '    <p class="muted" style="text-align:center;font-size:13px">Taxes calculated at checkout</p>' +
      '  </div>' +
      '</div>';
  }

  document.getElementById('cart').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]');
    if (!b) return;
    var cart = getCart();
    cart.forEach(function (l) { if (l.id === b.dataset.id) l.qty += parseInt(b.dataset.d, 10); });
    saveCart(cart.filter(function (l) { return l.qty > 0; }));
    render();
  });

  render();
</script>
</body>
</html>
