<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Ember &amp; Bean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/pixel.js"></script>
</head>
<body data-base="../">
<header id="site-header"></header>

<main class="container">
  <h1 class="page-title">Checkout</h1>
  <div id="checkout"></div>
</main>

<footer id="site-footer"></footer>

<script src="../assets/shop.js"></script>
<script>
  var lines = cartLines();
  var el = document.getElementById('checkout');

  if (!lines.length) {
    el.innerHTML = '<div class="empty">Your bag is empty. <a href="../#shop">Browse our coffee</a></div>';
  } else {
    var subtotal = cartTotal();
    var shipping = subtotal >= 40 ? 0 : 6;
    var total = subtotal + shipping;

    el.innerHTML =
      '<form class="two-col" id="checkout-form">' +
      '  <div>' +
      '    <div class="panel">' +
      '      <h2>Contact</h2>' +
      '      <div class="fields">' +
      '        <div class="full"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>' +
      '        <div class="full"><label for="phone">Phone (optional)</label><input id="phone" type="tel" placeholder="+1 555 000 0000" autocomplete="tel"></div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="panel" style="margin-top:16px">' +
      '      <h2>Shipping</h2>' +
      '      <div class="fields">' +
      '        <div><label for="first">First name</label><input id="first" required autocomplete="given-name"></div>' +
      '        <div><label for="last">Last name</label><input id="last" required autocomplete="family-name"></div>' +
      '        <div class="full"><label for="address">Address</label><input id="address" required autocomplete="street-address"></div>' +
      '        <div><label for="city">City</label><input id="city" required autocomplete="address-level2"></div>' +
      '        <div><label for="zip">ZIP</label><input id="zip" required autocomplete="postal-code"></div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="panel" style="margin-top:16px">' +
      '      <h2>Payment</h2>' +
      '      <label class="pay-option"><input type="radio" name="pay" value="invoice" id="pay-invoice" required> Pay by invoice</label>' +
      '      <label class="pay-option"><input type="radio" name="pay" value="cod" id="pay-cod"> Cash on delivery</label>' +
      '    </div>' +
      '  </div>' +
      '  <div class="panel">' +
      '    <h2>Order summary</h2>' + lines.map(function (l) {
        return '<div class="sum-row"><span>' + l.qty + ' × ' + l.product.name + '</span><span>' + money(l.product.price * l.qty) + '</span></div>';
      }).join('') +
      '    <div class="sum-row"><span>Shipping</span><span>' + (shipping ? money(shipping) : 'Free') + '</span></div>' +
      '    <div class="sum-row total"><span>Total</span><span>' + money(total) + '</span></div>' +
      '    <p><button class="btn block" type="submit" id="place-order">Place order</button></p>' +
      '  </div>' +
      '</form>';

    var payload = pixelContents(lines);
    track('InitiateCheckout', payload);

    var paymentTracked = false;
    document.querySelectorAll('input[name="pay"]').forEach(function (r) {
      r.addEventListener('change', function () {
        if (paymentTracked) return;
        paymentTracked = true;
        track('AddPaymentInfo', payload);
      });
    });

    document.getElementById('checkout-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var phone = document.getElementById('phone').value.replace(/[^\d+]/g, '');
      await identifyUser({ email: email, phone: phone });
      track('PlaceAnOrder', payload);

      var order = {
        number: 'EB-' + Math.floor(100000 + Math.random() * 900000),
        email: email,
        total: total,
        payload: payload,
        purchaseTracked: false
      };
      try { localStorage.setItem('eb_last_order', JSON.stringify(order)); } catch (err) {}
      saveCart([]);
      // Give the pixel a moment to send before navigating away.
      setTimeout(function () { location.href = '../thank-you/'; }, 400);
    });
  }
</script>
</body>
</html>
